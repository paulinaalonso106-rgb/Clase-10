<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML, SVG, CSS y JS</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
	<style>
	  body{font-family: "Space Grotesk", sans-serif;}
	</style>
</head>
<body>
<!--aca esta el svg-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1005 600" font-family="Arial, sans-serif"
onClick="alert('What?!')">
onClick="alert('What?!')">
  <style>
    .grid  { fill: none; stroke: lightgray; }
    .axis  { stroke: #000; }
    .label { font-size: 12px; text-anchor: middle; dominant-baseline: middle; }
    .tick  { font-size: 10px; text-anchor: end; dominant-baseline: middle; }
    .area  { fill-opacity: 0.2; transition:all ease .4s;}
	.area:hover  { fill-opacity: 0.4;transition:all ease .4s; }
    .legend-text { font-size: 10px; }
  </style>

  <rect width="1005" height="600" fill="#fff" />
  <rect width="805" height="600" fill="none" stroke="#ccc" />

  <!-- Gráfico -->
  <g transform="translate(305 315)">

    <!-- Círculos de la grilla (0 a 100, cada 10) -->
    <g class="grid">
      <circle r="285" /><circle r="257" /><circle r="228" /><circle r="200" />
      <circle r="171" /><circle r="143" /><circle r="114" /><circle r="86" />
      <circle r="57" /><circle r="29" />
    </g>

    <!-- Ejes -->
    <g class="axis">
      <line x2="0"       y2="-285" />
      <line x2="246.82"  y2="-142.5" />
      <line x2="246.82"  y2="142.5" />
      <line x2="0"       y2="285" />
      <line x2="-246.82" y2="142.5" />
      <line x2="-246.82" y2="-142.5" />
    </g>

    <!-- Etiquetas de los ejes -->
    <g class="label">
      <text x="0"       y="-295">Staff with PhD</text>
      <text x="255.48"  y="-147.5">Academic Reputation</text>
      <text x="255.48"  y="147.5">International Research Network</text>
      <text x="0"       y="295">Papers Per Faculty</text>
      <text x="-255.48" y="147.5">Citations per Paper</text>
      <text x="-255.48" y="-147.5">Faculty Student</text>
    </g>

    <!-- Escala del eje vertical -->
    <g transform="translate(0 -285)" fill="none">
      <path d="M-6,0.5H0.5V285.5H-6" stroke="#000" />
      <g class="tick" fill="#000">
        <text x="-9" y="0.5">100</text>
        <text x="-9" y="28.5">90</text>
        <text x="-9" y="57.5">80</text>
        <text x="-9" y="86.5">70</text>
        <text x="-9" y="114.5">60</text>
        <text x="-9" y="143.5">50</text>
        <text x="-9" y="171.5">40</text>
        <text x="-9" y="200.5">30</text>
        <text x="-9" y="228.5">20</text>
        <text x="-9" y="257.5">10</text>
        <text x="-9" y="285.5">0</text>
      </g>
    </g>

    <!-- Series -->
    <g id="pucc" fill="#c8bc32" stroke="#c8bc32">
      <polygon class="area" points="0,-281 246.82,-142.5 245.95,142 0,278 -191.39,110.5 -177.54,-102.5" />
      <g stroke="none">
        <circle cx="0"       cy="-281"   r="1" />
        <circle cx="246.82"  cy="-142.5" r="1" />
        <circle cx="245.95"  cy="142"    r="1" />
        <circle cx="0"       cy="278"    r="1" />
        <circle cx="-191.39" cy="110.5"  r="1" />
        <circle cx="-177.54" cy="-102.5" r="1" />
      </g>
    </g>

    <g id="uchile" fill="#4a90e2" stroke="#4a90e2">
      <polygon class="area" points="0,-205 246.82,-142.5 245.95,142 0,284 -189.66,109.5 -57.16,-33" />
      <g stroke="none">
        <circle cx="0"       cy="-205"   r="1" />
        <circle cx="246.82"  cy="-142.5" r="1" />
        <circle cx="245.95"  cy="142"    r="1" />
        <circle cx="0"       cy="284"    r="1" />
        <circle cx="-189.66" cy="109.5"  r="1" />
        <circle cx="-57.16"  cy="-33"    r="1" />
      </g>
    </g>

    <g id="udec" fill="#2ca02c" stroke="#2ca02c">
      <polygon class="area" points="0,-182 222.57,-128.5 244.22,141 0,255 -217.37,125.5 -92.66,-53.5" />
      <g stroke="none">
        <circle cx="0"       cy="-182"   r="1" />
        <circle cx="222.57"  cy="-128.5" r="1" />
        <circle cx="244.22"  cy="141"    r="1" />
        <circle cx="0"       cy="255"    r="1" />
        <circle cx="-217.37" cy="125.5"  r="1" />
        <circle cx="-92.66"  cy="-53.5"  r="1" />
      </g>
    </g>

    <g id="usach" fill="#d62728" stroke="#d62728">
      <polygon class="area" points="0,-84 234.69,-135.5 241.62,139.5 0,231 -150.69,87 -73.61,-42.5" />
      <g stroke="none">
        <circle cx="0"       cy="-84"    r="1" />
        <circle cx="234.69"  cy="-135.5" r="1" />
        <circle cx="241.62"  cy="139.5"  r="1" />
        <circle cx="0"       cy="231"    r="1" />
        <circle cx="-150.69" cy="87"     r="1" />
        <circle cx="-73.61"  cy="-42.5"  r="1" />
      </g>
    </g>
  </g>

  <!-- Leyenda -->
  <g transform="translate(810 30)">
    <text font-size="12" font-weight="bold">Institution Name</text>
    <g transform="translate(0 16)">
      <rect width="15" height="15" fill="#c8bc32" />
      <text class="legend-text" x="20" y="12.5">Pontificia Universidad<tspan x="20" dy="1.2em">Católica de Chile</tspan></text>

      <rect y="36.6" width="15" height="15" fill="#4a90e2" />
      <text class="legend-text" x="20" y="49.1">Universidad de Chile</text>

      <rect y="57.6" width="15" height="15" fill="#2ca02c" />
      <text class="legend-text" x="20" y="70.1">Universidad de Concepción</text>

      <rect y="78.6" width="15" height="15" fill="#d62728" />
      <text class="legend-text" x="20" y="91.1">Universidad de Santiago de<tspan x="20" dy="1.2em">Chile</tspan></text>
    </g>
  </g>
</svg>
<!--hasta acá no más-->
</body>
</html>
